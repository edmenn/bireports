server {
    listen 8080 default_server;
    server_tokens off;
    server_name biportal.sarcom.com.py;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Archivos estáticos con cache agresivo
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # 👉 Sirve /storage/* desde storage/app/public sin symlink
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;

        # Seguridad básica
        autoindex off;
        location ~ \.(php|phar|phtml)$ { return 404; }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
        # Propagar esquema/host originales desde Caddy a PHP
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  $server_port;
        # Indicar a PHP que la peticin es segura si llega con XFP=https
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param REQUEST_SCHEME $scheme;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Bloquea archivos ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
