version: "3.9"

services:
  # Proxy reverso con HTTPS automático
  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile con la config del sitio
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Carpeta donde Caddy guarda certificados y estado
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - sail
    depends_on:
      - birentable

  # Override de producción para no ocupar el puerto 80 en el host desde Sail
  birentable:
    # No necesitamos publicar puertos en producción (Caddy hablará por red interna)
    ports: []
    # Si usas Vite en producción, compila assets antes y desactívalo
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

networks:
  sail:
    external: false
