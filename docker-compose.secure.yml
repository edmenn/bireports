networks:
  backend:
    driver: bridge

services:
  # 1) Terminador TLS + proxy exterior (expuesto a Internet)
  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [backend]
    depends_on: [web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [ /tmp ]
    environment:
      TZ: ${APP_TIMEZONE:-UTC}

  # 2) Servidor web interno (solo red backend)
  web:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: ${APP_TIMEZONE:-UTC}

  # 3) PHP-FPM (Laravel) — contenedor de tu app
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: birentable/php-app:prod
    container_name: birentable
    restart: unless-stopped
    networks: [backend]
    # INYECTA TODAS LAS VARIABLES DESDE .env (sin hardcode)
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    depends_on: [pgsql]
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage         # escritura para storage/
      - app_cache:/var/www/html/bootstrap/cache   # escritura para cache
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5
  scheduler:
    image: birentable/php-app:prod
    container_name: scheduler
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp
      - /var/run
    entrypoint: ["/bin/sh","-lc"]
    command: "./scripts/run-scheduler.sh"
  queue_worker:
    image: birentable/php-app:prod
    container_name: queue-worker
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp
      - /var/run
    entrypoint: ["/bin/sh","-lc"]
    command: "./scripts/run-queue-worker.sh"

  # 4) PostgreSQL (red interna)
  pgsql:
    image: postgres:17
    container_name: pgsql
    restart: unless-stopped
    networks: [backend]
    # Postgres espera POSTGRES_* -> los tomamos desde tus DB_* del .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5) One-shot para poblar el volumen app_code con el código de la imagen
  code_init:
    image: birentable/php-app:prod
    user: "0:0"   # root para escribir en el volumen
    networks: [backend]
    entrypoint: sh
    command: -c "mkdir -p /mnt/app_code && cp -a /var/www/html/. /mnt/app_code/ && chown -R 1000:1000 /mnt/app_code"
    volumes:
      - app_code:/mnt/app_code

  # 6) Sincronizador incremental de código (rsync)
  code_sync:
    image: alpine:3.20
    working_dir: /src
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache rsync >/dev/null
        rsync -av --delete \
          --chown=1000:1000 \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='node_modules/' \
          --exclude='vendor/' \
          --exclude='storage/' \
          --exclude='bootstrap/cache/' \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='.env.local' \
          --exclude='docker-compose*.yml' \
          /src/ /dest/
    volumes:
      - ./:/src:ro
      - app_code:/dest

volumes:
  app_storage: {}
  app_cache: {}
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  app_code: {}
