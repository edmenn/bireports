networks:
  backend:
    driver: bridge
    name: birentable_backend   # explicit name so it stays consistent

services:

  # 1) Reverse proxy / TLS terminator
  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [backend]
    depends_on: [web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [ /tmp ]
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: 128M

  # 2) Internal Nginx (proxy to PHP)
  web:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    deploy:
      resources:
        limits:
          memory: 128M

  # 3) Laravel app (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: birentable/php-app:prod
    container_name: birentable
    restart: unless-stopped
    networks: [backend]
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${PRODUCTION_APP_URL:-https://biportal.sarcom.com.py}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: "172.16.0.0/12"
    depends_on: [pgsql]
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage
      - secure_app_cache:/var/www/html/bootstrap/cache
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /usr/local/var/run
    healthcheck:
      test: ["CMD", "php", "scripts/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # 4) Laravel scheduler
  scheduler:
    image: birentable/php-app:prod
    container_name: scheduler
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage
      - secure_app_cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp
      - /var/run
    entrypoint: ["/bin/sh","-lc"]
    command: "./scripts/run-scheduler.sh"
    deploy:
      resources:
        limits:
          memory: 384M

  # 5) Laravel queue worker
  queue_worker:
    image: birentable/php-app:prod
    container_name: queue-worker
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_code:/var/www/html:ro
      - app_storage:/var/www/html/storage
      - secure_app_cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp
      - /var/run
    entrypoint: ["/bin/sh","-lc"]
    command: "./scripts/run-queue-worker.sh"
    deploy:
      resources:
        limits:
          memory: 384M

  # 6) PostgreSQL
  pgsql:
    image: postgres:17
    container_name: pgsql
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # 7) One-shot for populating app_code
  code_init:
    image: birentable/php-app:prod
    user: "0:0"
    networks: [backend]
    entrypoint: sh
    command: -c "mkdir -p /mnt/app_code && cp -a /var/www/html/. /mnt/app_code/ && chown -R 1000:1000 /mnt/app_code"
    volumes:
      - app_code:/mnt/app_code

  # 8) Rsync sync helper
  code_sync:
    image: alpine:3.20
    working_dir: /src
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache rsync >/dev/null
        rsync -av --checksum --delete \
          --chown=1000:1000 \
          --exclude='/.git/' \
          --exclude='/.github/' \
          --exclude='/node_modules/' \
          --exclude='/vendor/' \
          --exclude='/storage/' \
          --exclude='/bootstrap/cache/' \
          --exclude='.env*' \
          --exclude='docker-compose*.yml' \
          /src/ /dest/
    volumes:
      - ./:/src:ro
      - app_code:/dest

volumes:
  app_storage: {}
  secure_app_cache: {}
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  app_code: {}
