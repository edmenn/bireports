version: "3.9"

networks:
  backend:
    driver: bridge

services:
  # 1) Terminador TLS + proxy exterior
  caddy:
    image: caddy:2.8
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [backend]
    depends_on: [web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp

  # 2) Servidor web interno (solo red interna)
  web:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    networks: [backend]
    depends_on: [app]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_code:/var/www/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # 3) PHP-FPM (Laravel) — contenedor 'birentable'
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: birentable/php-app:prod
    container_name: birentable
    restart: unless-stopped
    networks: [backend]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://portal.birentable.com
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: sail
      DB_PASSWORD: password
      TRUSTED_PROXIES: "*"
      TRUSTED_HOSTS: "portal.birentable.com"
    depends_on: [pgsql]
    volumes:
      - app_storage:/var/www/html/storage         # escritura para storage/
      - app_cache:/var/www/html/bootstrap/cache   # escritura para cache
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  # 4) PostgreSQL (red interna)
  pgsql:
    image: postgres:17
    container_name: pgsql
    restart: unless-stopped
    networks: [backend]
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-laravel}", "-U", "${DB_USERNAME:-sail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5) One-shot: poblar el volumen 'app_code' con el código de la imagen de app
  code_init:
    image: birentable/php-app:prod
    networks: [backend]
    command: ["sh","-lc","cp -a /var/www/html/. /mnt/app_code/"]
    volumes:
      - app_code:/mnt/app_code

volumes:
  app_storage: {}
  app_cache: {}
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  app_code: {}
